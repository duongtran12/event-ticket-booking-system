spring:
  application:
    name: eventticket

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/event_ticket_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:your_database_password}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your_email@gmail.com}
    password: ${MAIL_PASSWORD:your_app_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8081

app:
  mail:
    from: ${MAIL_FROM:your_email@gmail.com}

jwt:
  secret: ${JWT_SECRET:your_jwt_secret_key}
  expiration: 86400000

vnpay:
  tmnCode: ${VNPAY_TMN_CODE:your_vnpay_tmn_code}
  hashSecret: ${VNPAY_HASH_SECRET:your_vnpay_hash_secret}
  payUrl: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  returnUrl: ${VNPAY_RETURN_URL:http://localhost:8081/api/bookings/payment-callback}

gemini:
  api-key: ${GEMINI_API_KEY:your_gemini_api_key}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

openai:
  api-key: ${OPENAI_API_KEY:your_openai_api_key}
  model: ${OPENAI_MODEL:gpt-3.5-turbo}

chat:
  provider: ${CHAT_PROVIDER:gemini}